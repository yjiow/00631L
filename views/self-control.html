<!-- views/self-control.html — 自我掌握規劃 / 未來時間軸節點 -->
<div class="layout-grid">

    <!-- 左側：人生大事節點設定 -->
    <div class="panel-card">
        <div class="panel-title">自我掌握參數設定 (TIMELINE_CONTROL)</div>

        <div class="input-group">
            <div class="input-label">
                <span>目前年齡 (AGE)</span>
                <span class="input-value" id="val-cur-age">30</span>
            </div>
            <input type="range" id="input-cur-age" min="18" max="70" step="1" value="30">
        </div>

        <div class="input-group">
            <div class="input-label">
                <span>目標退休年齡 (TARGET)</span>
                <span class="input-value" id="val-retire-age">55</span>
            </div>
            <input type="range" id="input-retire-age" min="30" max="80" step="1" value="55">
        </div>

        <div class="input-group">
            <div class="input-label">
                <span>目前資產儲備 (TWD)</span>
                <span class="input-value" id="val-savings">1,000,000</span>
            </div>
            <input type="range" id="input-savings" min="0" max="10000000" step="100000" value="1000000">
        </div>

        <!-- 狀態摘要卡 -->
        <div class="data-grid" style="grid-template-columns: 1fr 1fr;">
            <div class="data-box">
                <label>累積時間跨度</label>
                <span id="res-timespan">25 年</span>
            </div>
            <div class="data-box">
                <label>節點安全狀態</label>
                <span id="res-status" style="color: var(--neon-blue);">SECURE</span>
            </div>
        </div>
    </div>

    <!-- 右側：科幻光軌時間軸 -->
    <div class="panel-card">
        <div class="panel-title">未來光軌節點檢視 (NODE_VISUALIZER)</div>
        <div style="margin-bottom: 16px; font-size: 0.82rem; color: var(--text-secondary);">
            光軌判定：<span style="color: var(--neon-blue);">● 電光藍（安全達成）</span> | <span style="color: #FF4D4D;">● 警示紅（資金缺口）</span>
        </div>

        <div id="timeline-track" style="position: relative; padding: 20px 0 20px 30px; border-left: 2px dashed rgba(0,210,255,0.3); display: flex; flex-direction: column; gap: 30px;">
            <!-- 節點 1: 起點 -->
            <div style="position: relative;">
                <div style="position: absolute; left: -37px; top: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--neon-blue); box-shadow: 0 0 10px var(--neon-blue);"></div>
                <div style="font-family: 'Share Tech Mono', monospace; color: var(--neon-blue); font-size: 0.95rem;">NODE_01: 當前啟動 (30 歲)</div>
                <div style="color: var(--text-secondary); font-size: 0.85rem; margin-top: 4px;">本金進入複利矩陣，基石鋪設完成。</div>
            </div>

            <!-- 節點 2: 買房/投資 -->
            <div style="position: relative;">
                <div style="position: absolute; left: -37px; top: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--neon-blue); box-shadow: 0 0 10px var(--neon-blue);"></div>
                <div style="font-family: 'Share Tech Mono', monospace; color: var(--neon-blue); font-size: 0.95rem;">NODE_02: 購屋與大額支出 (38 歲)</div>
                <div style="color: var(--text-secondary); font-size: 0.85rem; margin-top: 4px;">頭期款自籌 $3,000,000，資產持續運轉。</div>
            </div>

            <!-- 節點 3: 財務自由/退休 -->
            <div style="position: relative;">
                <div style="position: absolute; left: -37px; top: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--neon-blue); box-shadow: 0 0 10px var(--neon-blue);"></div>
                <div style="font-family: 'Share Tech Mono', monospace; color: var(--neon-blue); font-size: 0.95rem;">NODE_03: 目標退休 (55 歲)</div>
                <div style="color: var(--text-secondary); font-size: 0.85rem; margin-top: 4px;">達成 00631L 動態提領安全門檻，解放人生選擇權。</div>
            </div>
        </div>
    </div>

</div>
