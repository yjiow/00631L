# 每個交易日收盤後自動補抓證交所股價，有新資料才 commit + push（Vercel 自動部署）
name: 更新股價資料

on:
  schedule:
    - cron: '30 7 * * 1-5'   # 台灣 15:30
    - cron: '30 11 * * 1-5'  # 台灣 19:30（補抓）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 補抓股價
        run: bash scripts/update-data.sh public/data

      - name: 有變更才 commit + push
        run: |
          if git diff --quiet public/data/; then echo "無新資料"; exit 0; fi
          git config user.name "YingJer Liao"
          git config user.email "yjiow2008@gmail.com"
          git add public/data/
          git commit -m "資料：股價更新至 $(grep -o '"date":"[0-9-]*"' public/data/00631L.json | tail -1 | cut -d'"' -f4)"
          git push
